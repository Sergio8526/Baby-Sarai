<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos | Administración Baby Saraí</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <!-- Barra lateral de navegación -->
  <header class="barra">
    <a href="productos.html" class="marca">
      <span class="marca-nombre">Baby Saraí</span>
      <span class="marca-detalle">Panel de administración</span>
    </a>
    <nav aria-label="Secciones del panel">
      <a href="productos.html" class="activo" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 4 5.5v4L6 9v12h12V9l2 .5v-4L16 3c-.6 1.7-2.1 2.8-4 2.8S8.6 4.7 8 3Z"/></svg>
        Productos
      </a>
      <a href="categorias.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1.4 1.4 0 0 1 0 2l-6.7 6.7a1.4 1.4 0 0 1-2 0l-8.3-8.3Z"/><circle cx="8.2" cy="8.2" r="1.4"/></svg>
        Categorías
      </a>
    </nav>
  </header>

  <main>
    <div class="cabecera-pagina">
      <h1>Productos</h1>
      <p>Registra los productos de la tienda, actualiza precios y stock, y decide cuáles se ven en la tienda.</p>
    </div>

    <!-- Formulario para crear o editar un producto.
         novalidate: la validación la hace el servidor y los errores se muestran abajo. -->
    <section class="tarjeta">
      <h2 id="tituloFormulario">Nuevo producto</h2>
      <form id="formProducto" class="formulario" novalidate>
        <input type="hidden" id="id">

        <label>Nombre *
          <input type="text" id="nombre" maxlength="100">
        </label>
        <label>Categoría *
          <select id="categoriaId"></select>
        </label>
        <label>Precio (COP) *
          <input type="number" id="precio" min="0" step="100">
        </label>
        <label>Talla
          <input type="text" id="talla" maxlength="20" placeholder="Ej: 0-3 meses">
        </label>
        <label>Estado
          <select id="estado">
            <option value="nuevo">Nuevo</option>
            <option value="usado">Usado</option>
          </select>
        </label>
        <label>Stock
          <input type="number" id="stock" min="0" step="1" value="0">
        </label>
        <label class="completo">Descripción
          <input type="text" id="descripcion" maxlength="255">
        </label>
        <label class="casilla completo">
          <input type="checkbox" id="activo" checked>
          Visible en la tienda
        </label>

        <div class="acciones">
          <button type="submit" id="btnGuardar">Guardar producto</button>
          <button type="button" class="secundario" id="btnCancelar">Cancelar</button>
        </div>
      </form>
      <div id="mensaje" class="mensaje" role="status"></div>
    </section>

    <!-- Listado de productos con filtro por categoría -->
    <section class="tarjeta">
      <div class="encabezado-tabla">
        <h2>Inventario</h2>
        <select id="filtroCategoria" aria-label="Filtrar por categoría"></select>
      </div>
      <div class="tabla-contenedor">
        <table>
          <thead>
            <tr>
              <th>Nombre</th><th>Categoría</th><th>Talla</th><th>Estado</th>
              <th>Precio</th><th>Stock</th><th>Tienda</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaProductos"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="js/productos.js"></script>
</body>
</html>
