<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías | Administración Baby Saraí</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <!-- Barra lateral de navegación -->
  <header class="barra">
    <a href="productos.html" class="marca">
      <span class="marca-nombre">Baby Saraí</span>
      <span class="marca-detalle">Panel de administración</span>
    </a>
    <nav aria-label="Secciones del panel">
      <a href="productos.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 4 5.5v4L6 9v12h12V9l2 .5v-4L16 3c-.6 1.7-2.1 2.8-4 2.8S8.6 4.7 8 3Z"/></svg>
        Productos
      </a>
      <a href="categorias.html" class="activo" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1.4 1.4 0 0 1 0 2l-6.7 6.7a1.4 1.4 0 0 1-2 0l-8.3-8.3Z"/><circle cx="8.2" cy="8.2" r="1.4"/></svg>
        Categorías
      </a>
    </nav>
  </header>

  <main>
    <div class="cabecera-pagina">
      <h1>Categorías</h1>
      <p>Organiza el catálogo. Una categoría con productos no se puede eliminar; desactívala si ya no la usas.</p>
    </div>

    <!-- Formulario para crear o editar una categoría -->
    <section class="tarjeta">
      <h2 id="tituloFormulario">Nueva categoría</h2>
      <form id="formCategoria" class="formulario" novalidate>
        <input type="hidden" id="id">

        <label>Nombre *
          <input type="text" id="nombre" maxlength="60">
        </label>
        <label>Descripción
          <input type="text" id="descripcion" maxlength="255">
        </label>
        <label class="casilla completo">
          <input type="checkbox" id="activo" checked>
          Categoría activa
        </label>

        <div class="acciones">
          <button type="submit" id="btnGuardar">Guardar categoría</button>
          <button type="button" class="secundario" id="btnCancelar">Cancelar</button>
        </div>
      </form>
      <div id="mensaje" class="mensaje" role="status"></div>
    </section>

    <!-- Listado de categorías -->
    <section class="tarjeta">
      <div class="encabezado-tabla">
        <h2>Categorías</h2>
      </div>
      <div class="tabla-contenedor">
        <table>
          <thead>
            <tr><th>Nombre</th><th>Descripción</th><th>Estado</th><th>Acciones</th></tr>
          </thead>
          <tbody id="tablaCategorias"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="js/categorias.js"></script>
</body>
</html>
