# Memoria para el proceso de Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Usar las librerías AndroidX
android.useAndroidX=true

# Cada módulo solo ve sus propios recursos en la clase R (compila más rápido)
android.nonTransitiveRClass=true

# ---------------------------------------------------------------
# Dirección de la API REST de Baby Saraí (servidor Node.js + Express)
#  - Emulador de Android Studio: 10.0.2.2 es el "localhost" del computador.
#  - Teléfono físico: cambiar por la IP del computador en la red Wi-Fi,
#    por ejemplo http://192.168.1.50:3000/api/  (y agregarla en
#    app/src/main/res/xml/network_security_config.xml).
# ---------------------------------------------------------------
BABYSARAI_API_URL=http://10.0.2.2:3000/api/
