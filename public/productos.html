<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos | Administración Baby Saraí</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="barra">
    <h1>Baby Saraí · Administración</h1>
    <nav>
      <a href="productos.html" class="activo">Productos</a>
      <a href="categorias.html">Categorías</a>
    </nav>
  </header>

  <main>
    <!-- Formulario para crear o editar un producto.
         novalidate: la validación la hace el servidor y los errores se muestran abajo. -->
    <section class="tarjeta">
      <h2 id="tituloFormulario">Nuevo producto</h2>
      <form id="formProducto" class="formulario" novalidate>
        <input type="hidden" id="id">

        <label>Nombre *
          <input type="text" id="nombre" maxlength="100">
        </label>
        <label>Categoría *
          <select id="categoriaId"></select>
        </label>
        <label>Precio (COP) *
          <input type="number" id="precio" min="0" step="100">
        </label>
        <label>Talla
          <input type="text" id="talla" maxlength="20" placeholder="Ej: 0-3 meses">
        </label>
        <label>Estado
          <select id="estado">
            <option value="nuevo">Nuevo</option>
            <option value="usado">Usado</option>
          </select>
        </label>
        <label>Stock
          <input type="number" id="stock" min="0" step="1" value="0">
        </label>
        <label class="completo">Descripción
          <input type="text" id="descripcion" maxlength="255">
        </label>
        <label class="casilla completo">
          <input type="checkbox" id="activo" checked>
          Visible en la tienda
        </label>

        <div class="acciones">
          <button type="submit" id="btnGuardar">Guardar producto</button>
          <button type="button" class="secundario" id="btnCancelar">Cancelar</button>
        </div>
      </form>
      <div id="mensaje" class="mensaje" role="status"></div>
    </section>

    <!-- Listado de productos con filtro por categoría -->
    <section class="tarjeta">
      <div class="encabezado-tabla">
        <h2>Inventario</h2>
        <select id="filtroCategoria" aria-label="Filtrar por categoría"></select>
      </div>
      <div class="tabla-contenedor">
        <table>
          <thead>
            <tr>
              <th>Nombre</th><th>Categoría</th><th>Talla</th><th>Estado</th>
              <th>Precio</th><th>Stock</th><th>Tienda</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaProductos"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="js/productos.js"></script>
</body>
</html>
