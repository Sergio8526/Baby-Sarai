plugins {
    id 'com.android.application'
}

// La URL de la API se lee de gradle.properties; si no existe se usa la del emulador.
def apiUrl = project.findProperty("BABYSARAI_API_URL") ?: "http://10.0.2.2:3000/api/"

android {
    namespace = 'com.babysarai.app'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.babysarai.app"
        minSdk = 24          // Android 7.0: cubre más del 97 % de los teléfonos
        targetSdk = 36
        versionCode = 2
        versionName = "2.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        // Queda disponible en el código como BuildConfig.API_BASE_URL
        buildConfigField "String", "API_BASE_URL", "\"${apiUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true   // Genera clases de enlace para cada layout XML
        buildConfig = true   // Genera la clase BuildConfig con la URL de la API
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Capa de presentación (UI)
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment:1.8.5'

    // Arquitectura MVVM: ViewModel y LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'

    // Acceso a la API REST: Retrofit + conversión JSON con Gson
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    // Pruebas unitarias
    testImplementation 'junit:junit:4.13.2'
}
